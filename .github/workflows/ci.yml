name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests and lint
        run: ./gradlew test lint --stacktrace
      - name: Validation report on fixtures
        run: ./gradlew :validation:run --args="report --fixtures validation/fixtures --out validation/reports/report.md"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports
          path: |
            validation/reports/
            **/build/reports/
